# Netlify: static Next.js export + the "Maha" AI chat function
[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Static export: skip Netlify's Next.js server runtime
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Site lives at the domain root on Netlify
  NEXT_PUBLIC_BASE_PATH = ""
  # Turns on AI answers in the 24×7 chat (uses netlify/functions/chat.mts)
  NEXT_PUBLIC_CHAT_API = "/api/chat"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Local testing with real AI: `npx netlify-cli dev` (reads GEMINI_API_KEY from .env)
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 3000
  port = 8888
